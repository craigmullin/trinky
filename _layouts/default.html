<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#21112F">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}TriNKY</title>
  <link rel="icon" href="/favicon-reversed.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="TriNKY blog" href="/feed.xml">
  <style>
    :root{--plum:#21112F;--orange:#F35A28;--lime:#C5F04A;--chalk:#F3F2EE}
    *{box-sizing:border-box}body{margin:0;background:var(--chalk);color:var(--plum);font:16px/1.7 Inter,Arial,Helvetica,sans-serif}
    a{color:inherit}header{background:var(--plum);color:var(--chalk);border-bottom:5px solid var(--orange)}
    .nav{max-width:1120px;margin:auto;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand img{display:block;width:145px;height:auto}.nav nav{display:flex;gap:24px;flex-wrap:wrap}.nav nav a{text-decoration:none;font-size:.8rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .nav nav a:hover,.nav nav a[aria-current=page]{color:var(--lime)}.wrap{max-width:900px;margin:auto;padding:0 26px}
    .hero{background:var(--plum);color:var(--chalk);padding:64px 0 72px}.eyebrow{color:var(--lime);text-transform:uppercase;letter-spacing:.22em;font-size:.75rem;font-weight:800}
    h1{font-size:clamp(2.8rem,8vw,5.5rem);line-height:1;letter-spacing:-.07em;margin:15px 0 20px}h1 em{font-style:normal;color:var(--orange)}
    .hero p{max-width:650px;font-size:1.15rem;color:#e4dce9;margin:0}.content{padding:48px 0 85px}
    .post-list{display:grid;gap:18px}.post-card{background:#fff;border-left:5px solid var(--orange);padding:25px 28px}
    .post-card:nth-child(2n){border-color:var(--lime)}.post-card h2{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15;letter-spacing:-.045em;margin:5px 0 10px}
    .post-card h2 a{text-decoration:none}.post-card h2 a:hover{color:#8d537f}.meta{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#7c4a70}.excerpt{margin:0;color:#514653}
    .article{background:#fff;padding:clamp(24px,5vw,54px);border-top:6px solid var(--orange)}.article h1{font-size:clamp(2.4rem,6vw,4.5rem);margin:10px 0 16px}
    .article h2,.article h3{line-height:1.2;letter-spacing:-.04em}.article a{color:#8b3d1c}.article img{max-width:100%;height:auto}.article blockquote{border-left:4px solid var(--lime);margin-left:0;padding-left:20px;color:#514653}
    .back{display:inline-block;margin-bottom:22px;font-weight:800;text-decoration:none}.empty{background:#fff;padding:30px;border-top:5px solid var(--lime)}
    footer{background:var(--plum);color:#ded6e3;padding:28px 0;font-size:.82rem}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    @media(max-width:620px){.nav{align-items:flex-start;flex-direction:column}.brand img{width:120px}.nav nav{gap:15px}.nav nav a{font-size:.72rem}.hero{padding:48px 0 55px}.content{padding:30px 0 60px}}
  </style>
</head>
<body>
<header><div class="nav">
  <a class="brand" href="/" aria-label="TriNKY home"><img src="/TriNKY_Final_Identity/TriNKY_Reversed.svg" alt="TriNKY — Swim Ride Run Together"></a>
  <nav aria-label="Main navigation"><a href="/">Home</a><a href="/calendar.html">Races</a><a href="/blog/" aria-current="page">Blog</a></nav>
</div></header>
{{ content }}
<footer><div class="wrap"><span>© {{ site.time | date: "%Y" }} TriNKY · Swim · Ride · Run · Together</span><span>Rooted in Northern Kentucky. Open to everyone.</span></div></footer>
</body>
</html>
